<script src="https://code.jquery.com/jquery-3.7.1.slim.min.js"
    integrity="sha256-kmHvs0B+OpCW5GVHUNjv9rOmY0IvSIRcf7zGUDTDQM8=" crossorigin="anonymous"></script>
<script>

    function setupCanvas(canvas) {
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();

        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;

        const ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);

        return ctx;
    }

    const canvas = document.getElementById('canvas');
    const ctx = setupCanvas(canvas);
    flight_details = {% if flight_details %}
        JSON.parse('{{ flight_details | safe }}')
    {% else %}
        {
            "airline": "AA",
            "flight_number": "123",
            "departure_airport": "LAX",
            "arrival_airport": "JFK",
            "departure_time": "2023-12-25 08:00:00",
            "arrival_time": "2023-12-25 16:00:00",
            "coupon_code": "HOLIDAY2023"
        }
    {% endif %};

    // Load the image
    const image = new Image();

    image.src = '/static/certificate.png'; // Replace with the path to your image

    function generateCertificate() {
        // Get the text from the input
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(image, 0, 0, 1440.86, 1021.13);
        ctx.imageSmoothingEnabled = false;
        const name = document.getElementById('name').value;
        // const name = 'nir ohfeld';
        const date = new Date().toLocaleDateString('en-US', { day: '2-digit', month: 'short' }).toUpperCase().split(' ').reverse().join('');
        const gate = Math.floor(Math.random() * 30) + 1;
        const seat = Math.floor(Math.random() * 30) + 1 + String.fromCharCode(65 + Math.floor(Math.random() * 6));

        // Set the text style
        ctx.font = 'bold 56px DM Sans';
        ctx.fillStyle = '#0254EC';
        ctx.textAlign = 'left';

        // Draw the text on the canvas
        ctx.fillText(name.toUpperCase(), 467, 467);

        ctx.font = '600 30px DM Sans';
        ctx.fillStyle = '#0254EC';
        ctx.textAlign = 'left';

        // Draw the text on the canvas
        ctx.fillText(date.toUpperCase(), 1021, 450);
        // ctx.fillText(gate.toString(), 1163, 450);
        ctx.fillText('1', 1163, 450);
        ctx.fillText(seat.toString(), 1021, 530);
        ctx.fillText('PA1337', 1163, 530);
        // ctx.fillText(flight_details.departure_airport || 'Unknown', 1021, 610);
        // ctx.fillText(flight_details.arrival_airport || 'Unknown', 1163, 610);
        const certificateData = {
            image: canvas.toDataURL('image/png')
        };

        // Only perform the fetch after canvas has been converted to JSON
        setTimeout(() => {
            fetch('/upload-certificate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(certificateData)
            }).then((response) => {
                if (response.ok) {
                    return response.json();
                } else {
                    throw new Error('Upload failed');
                }
            }).then((data) => {
                window.location.href = data.url;
            }).catch((error) => {
                console.error('Error:', error);
            });
        }, 500);

    }
</script>
